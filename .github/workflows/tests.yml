name: Go

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify dependencies
        run: go mod download

      - name: Compile application
        run: go build -o "$RUNNER_TEMP/scheduler" .

      - name: Run tests against isolated SQLite database
        shell: bash
        run: |
          export TODO_DBFILE="$RUNNER_TEMP/scheduler_test.db"
          export TODO_PASSWORD="$(openssl rand -hex 32)"
          "$RUNNER_TEMP/scheduler" > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for i in {1..30}; do
            if curl --fail --silent http://localhost:7540/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi
          go test -count=1 ./...
